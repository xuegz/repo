server:
  port: 8080

spring:
  # 默认连接本机 MySQL；本地演示可改成 h2（内存库，重启数据重置）
  # 生产环境由服务器 config/application.yml 覆盖 datasource，密码不进仓库
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jiancai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  # 数据库结构由 Flyway 统一管理，MySQL 与 H2 共用 db/migration 下的同一套脚本
  # 已有库（非空）首次接入时不回放历史脚本，直接以 V2 为基线，从 V3 起继续演进
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭；本地调试时设环境变量 MYBATIS_PLUS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_PLUS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

# 自定义配置
jiancai:
  # 首次启动自动创建默认账号（已存在则跳过）：admin/123456、merchant/123456
  # 创建的默认账号首次登录强制改密；生产环境请通过 JIANCAI_INIT_DEFAULT_ACCOUNT=false 关闭
  init-default-account: ${JIANCAI_INIT_DEFAULT_ACCOUNT:true}
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入随机字符串，使用内置默认值时启动会打印告警
    secret: ${JWT_SECRET:jiancai-dev-only-secret-do-not-use-in-prod}
    expire-hours: 24
    # 小程序用户聊天 token 有效期（小时）
    user-expire-hours: ${JWT_USER_EXPIRE_HOURS:720}
  # CORS 跨域白名单（逗号分隔）：后台走 Vite 代理/Nginx 同源部署时本不需要跨域，
  # 此处仅放行本地开发端口；生产如需直连请通过 CORS_ALLOWED_ORIGINS 设置后台域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    # 图片上传目录（Windows 示例），未配置 OSS 时的本地回退目录
    path: D:/jiancai-upload/
    # 对外访问前缀
    url-prefix: /upload/
  # 阿里云 OSS：access-key-id 为空时自动回退本地磁盘
  # 凭据请通过环境变量或未跟踪的 server/config/application.yml 注入，不要提交仓库
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # 对外访问域名，留空则使用 https://{bucket}.{endpoint}
    public-domain: ${OSS_PUBLIC_DOMAIN:}
    # 对象目录前缀，最终 key 形如 jiancai/2026/11/uuid.jpg
    dir-prefix: ${OSS_DIR_PREFIX:jiancai}
  # 微信小程序登录：secret 请通过环境变量或未跟踪的配置文件注入，不要提交仓库
  wx:
    appid: ${WX_APPID:wxe89d8f5f1af02052}
    secret: ${WX_SECRET:}
    # 订阅消息：模板「咨询回复通知」（回复人、回复时间、回复内容、咨询人、咨询内容）
    subscribe:
      quote-template-id: ${WX_SUBSCRIBE_QUOTE_TEMPLATE_ID:}
      quote-page: ${WX_SUBSCRIBE_QUOTE_PAGE:pages/inquiry/inquiry}
      # developer=开发版 trial=体验版 formal=正式版
      miniprogram-state: ${WX_SUBSCRIBE_STATE:formal}
      # 字段名按模板实际内容配置
      fields:
        replier: name1
        reply-time: date2
        reply-content: thing3
        asker: name4
        ask-content: thing5
