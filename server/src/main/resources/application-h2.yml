spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL 兼容 MySQL 语法；DB_CLOSE_DELAY=-1 保证内存库在连接关闭时不丢失
    # 建表与演示数据由 Flyway 在启动时执行 classpath:db/migration
    url: jdbc:h2:mem:jiancai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
