xxl:
  job:
    admin:
#      addresses: http://localhost:15032/xxl-job-admin # 调度中心部署跟地址：如调度中心集群部署存在多个地址则用逗号分隔。执行器将会使用该地址进行"执行器心跳注册"和"任务结果回调"。
      addresses: http://172.17.3.218:8181
    executor:
      # 执行器"AppName"和地址信息配置：AppName执行器心跳注册分组依据；地址信息用于"调度中心请求并触发任务"和"执行器注册"。执行器默认端口为9999，执行器IP默认为空表示自动获取IP，多网卡时可手动设置指定IP，该IP不会绑定Host仅作为通讯实用。单机部署多个执行器时，注意要配置不同执行器端口；
      appname: atoken-update-job
      ip:
      port: 15041
      # 执行器运行日志文件存储的磁盘位置，需要对该路径拥有读写权限
      logpath: /opt/atoken/logs
      # 执行器Log文件定期清理功能，指定日志保存天数，日志文件过期自动删除。限制至少保持3天，否则功能不生效；
      logretentiondays: -1
    # xxl-job, access token：执行器通讯TOKEN，非空时启用
    accessToken: wcs_!*0127aim


